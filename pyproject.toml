[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-rag"
version = "0.1.0"
description = "Personal, provenance-first YouTube knowledge archive"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.13,<2", "streamlit>=1.41,<2",
  "httpx>=0.28,<0.29", "youtube-transcript-api>=1.2,<2",
  "trafilatura>=2,<3", "pyyaml>=6,<7", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
knowledge-rag = "knowledge_rag.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333/tcp"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://knowledge:knowledge@localhost:${{ job.services.postgres.ports[5432] }}/knowledge_test
          TEST_QDRANT_URL: http://localhost:${{ job.services.qdrant.ports[6333] }}
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          cp config.example.yaml config.yaml
          docker compose config --quiet
      - name: Build and smoke-test application services
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8501/_stcore/health
          docker compose exec -T worker knowledge-rag ask 'Come funziona Qdrant?'
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
